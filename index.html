<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Fake Dev Goes to Amsterdam</title>

    <!-- The SVG is the real icon; the PNGs are for the two places that cannot
         take one — Safari before 16.4, and iOS, which wants 180 and masks the
         corners. Rebuild them with `npm run icons`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Build a component together. One of you has no idea what it is." />

    <!-- The share card. `og:url` and the image are absolute because a scraper
         has no page to resolve a relative path against, and the image is a real
         PNG for the same reason nobody ships SVG here: no major scraper renders
         one. Regenerate it with `npm run og` — see scripts/og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Fake Dev Goes to Amsterdam" />
    <meta property="og:url" content="https://fakedev.ludoratory.com/" />
    <meta property="og:title" content="A Fake Dev Goes to Amsterdam" />
    <meta property="og:description" content="Build a component together. One of you has no idea what it is." />
    <meta property="og:image" content="https://fakedev.ludoratory.com/ogimage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Amsterdam canal houses over the title A Fake Dev Goes to Amsterdam"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Fake Dev Goes to Amsterdam" />
    <meta name="twitter:description" content="Build a component together. One of you has no idea what it is." />
    <meta name="twitter:image" content="https://fakedev.ludoratory.com/ogimage.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
