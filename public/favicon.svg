<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="A Fake Dev Goes to Amsterdam">
  <!--
    One canal house, not the skyline.

    The cover's row of five is a wide piece of art and there is no version of it
    that survives 16 pixels — at tab size it collapses into a striped smudge. So
    the mark is a single stepped gable, which is the one shape in that row you
    could still recognise if it were the only thing left, and the step is what
    makes it read as Amsterdam rather than as a generic house with a pointed
    roof.

    The ink field is part of the icon rather than transparency, because a browser
    tab can be light or dark and a flame silhouette needs its own dark ground to
    hold the colour either way.
  -->
  <defs>
    <clipPath id="field">
      <circle cx="16" cy="16" r="16" />
    </clipPath>
  </defs>

  <!-- `data-field` so the icon script can find *this* circle and not the one in
       the clip path when it squares the mark off for iOS. Given a value because
       an SVG is XML, where a bare attribute is a parse error rather than the
       shorthand it is in HTML. -->
  <circle data-field="true" cx="16" cy="16" r="16" fill="#101935" />

  <!-- Grown out of the bottom of the circle rather than centred in it: the base
       sits on the very edge and the arc trims its outer corners, which is what
       makes the house look like it is standing in the mark instead of floating
       inside it. Bigger than it can strictly fit, for the same reason — the
       clip is doing deliberate work. -->
  <!-- The clip is on a wrapper with no transform of its own, and the scaling
       happens inside it. `clip-path` resolves in the referencing element's user
       space, which *includes* that element's transform — so putting both on one
       group scaled the clip circle along with the house and clipped nothing. -->
  <g clip-path="url(#field)">
  <g transform="translate(16 32) scale(1.12) translate(-16 -29)">
  <path
    fill="#ff972e"
    d="M9 29V12h2V9h2V6h1.5l1.5-2 1.5 2H19v3h2v3h2v17H9Z"
  />
  <!--
    Two windows over a door and a window, cut back to the field.

    Deliberately asymmetric: a door centred under two windows is a face, and at
    tab size that is all anybody sees. Off-centring the door and giving the
    ground floor a second opening is also how the real houses are built — the
    front door sits beside the window, not between two of them.
  -->
  <path
    fill="#101935"
    d="M11.5 14.5h3.5v5h-3.5zM17.5 14.5h3.5v5h-3.5zM11.5 23h3.5v6h-3.5zM17.5 23h3.5v3.5h-3.5z"
  />
  </g>
  </g>
</svg>
